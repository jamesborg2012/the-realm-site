# The Realm Malta — local development stack.
#
#   cp .env.example .env
#   docker compose up -d
#
# First boot installs WordPress, runs `composer install` (Storefront + WooCommerce
# + third-party plugins), and activates the custom theme + realm-* plugins.
# Site:        ${WP_URL}      (admin: ${WP_ADMIN_USER}/${WP_ADMIN_PASSWORD})
# phpMyAdmin:  http://localhost:${PMA_PORT}
# Requires a hosts entry:  127.0.0.1  local.therealmmalta.com

# Shared mounts: WP core lives in the wp_html named volume; our custom code is
# bind-mounted on top so edits on the host are live in the container.
x-wp-mounts: &wp-mounts
  - wp_html:/var/www/html
  - ./composer.json:/var/www/html/composer.json
  - ./auth.json:/tmp/composer/auth.json:ro   # ACF PRO credentials — in Composer's home, NOT the web root
  - ./wp-content/uploads:/var/www/html/wp-content/uploads
  - ./wp-content/themes/the-realm-malta:/var/www/html/wp-content/themes/the-realm-malta
  - ./wp-content/plugins/realm-barcode-scanner:/var/www/html/wp-content/plugins/realm-barcode-scanner
  - ./wp-content/plugins/realm-events-manager:/var/www/html/wp-content/plugins/realm-events-manager
  - ./wp-content/plugins/realm-gw-excel-uploader:/var/www/html/wp-content/plugins/realm-gw-excel-uploader
  - ./wp-content/plugins/realm-gw-order-tracker:/var/www/html/wp-content/plugins/realm-gw-order-tracker
  - ./wp-content/plugins/realm-members-manager:/var/www/html/wp-content/plugins/realm-members-manager
  - ./wp-content/plugins/realm-sales-system:/var/www/html/wp-content/plugins/realm-sales-system

services:
  db:
    image: mysql:8.4   # matches prod (MySQL 8.4); the dump uses a MySQL-only collation
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      # One-time import: MySQL runs *.sql here only when db_data is empty (first init).
      # Re-import with: docker compose down -v && docker compose up -d
      - ./docker/db/data:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 180s   # generous: importing the ~38MB dump on first boot takes a while

  wordpress:
    image: wordpress:6.7-php8.2-apache   # prod runs WP 7.x — bump this tag to match when needed
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WP_PORT}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_TABLE_PREFIX: ${WP_TABLE_PREFIX}   # prod/dump uses the cki_ prefix (not wp_)
      WORDPRESS_DEBUG: "1"
      WP_URL: ${WP_URL}
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
        @ini_set( 'display_errors', 0 );
        /* Pin the site URL to the local domain regardless of DB values. */
        if ( getenv( 'WP_URL' ) ) {
            define( 'WP_HOME', getenv( 'WP_URL' ) );
            define( 'WP_SITEURL', getenv( 'WP_URL' ) );
        }
    volumes: *wp-mounts

  # One-shot bootstrap: composer install + wp core install + activate everything.
  # Exits 0 when done; re-runs are idempotent (skips install if already set up).
  wpcli:
    build: ./docker/wpcli
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_TABLE_PREFIX: ${WP_TABLE_PREFIX}   # must match the wordpress service, or wp-cli falls back to wp_
      WP_URL: ${WP_URL}
      PROD_URL: ${PROD_URL}
      WP_TITLE: ${WP_TITLE}
      WP_ADMIN_USER: ${WP_ADMIN_USER}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL}
    volumes: *wp-mounts
    restart: "no"

  phpmyadmin:
    image: phpmyadmin:5
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PMA_PORT}:80"
    environment:
      PMA_HOST: db
      UPLOAD_LIMIT: 256M

volumes:
  db_data:
  wp_html:
